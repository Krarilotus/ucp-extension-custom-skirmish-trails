option_4_header: 'Katı mod: sefer CSV ve JSON dosyalarını ayrıntılı denetle'
option_4_text: |-
  Sefer dosyalarındaki her sorunu günlüğe kaydeder. Oyun başlangıcında hata pencereleri gösterebilir. Kapalıyken sorunlu dosya başına bir uyarı gösterilir.
menu_paths_intro: "Bu sefer için tanımlanan dosyalar. Bir dosyayı dışarıda bırakmak için yolunu temizleyin, ardından \"Kaydet ve Kapat\"a basın."
menu_paths_settings: "Sefer ayar dosyası"
