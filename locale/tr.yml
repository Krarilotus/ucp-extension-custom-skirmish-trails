option_2_2_header: CSV dosyası (sefer ayar dosyası olmadan)
option_2_2_text: |-
  Sefer ayar dosyası olmadan kullanım için Warchest seferinin CSV dosyası. trail_missions içeren bir sefer ayar dosyası bunun yerini alır.
option_2_3_header: Dosya yolları
option_2_3_text: |-
  Warchest seferi için tanımlanan dosyaları görüntüleyin ve temizleyin
option_2_4_header: CSV verileri
option_2_4_text: |-
  Warchest seferinin CSV dosyasını görev başına bir JSON dosyasına dışa aktarın veya bu JSON dosyalarını tekrar CSV dosyasına içe aktarın
option_3_header: Extreme Seferi
option_3_text: |-
  Extreme seferini özelleştirin.
option_3_1_header: Sefer ayar dosyası
option_3_1_text: |-
