option_4_header: 'Katı mod: sefer CSV ve JSON dosyalarını ayrıntılı denetle'
option_4_text: |-
  Sefer CSV, görev, dil ve ayar dosyalarındaki her sorunu, oyunun kendi değerine geri dönen her sefer ayarını ve bir dil dosyasında eksik olan her metni günlüğe kaydeder. Oyun başlangıcında hata pencereleri gösterebilir. Kapalıyken sorunlu dosya başına bir uyarı gösterilir.
