option_1_header: İlk Sürüm Seferi (First Edition Trail)
option_1_text: |-
  İlk çarpışma seferini özelleştirin. Genellikle burada yalnızca sefer ayar dosyasını belirtmek yeterlidir: seferin görev verilerini (trail_missions) ve dil dosyalarını kendisi tanımlar.
option_1_1_header: Sefer ayar dosyası
option_1_1_text: |-
  İlk seferin ayarlarını içeren bir .json dosyası: görev verileri (CSV ve görev JSON dosyaları), dil dosyaları, başlık, özet, başlangıç yılı, düğme görselleri, arka plan, görev konumları ve yapay zekâ adları (bkz. trail-settings.schema.json). Oyunun kendi değerlerini korumak için boş bırakın.
option_1_2_header: CSV dosyası (sefer ayar dosyası olmadan)
option_1_2_text: |-
  Sefer ayar dosyası olmadan kullanım için ilk seferin CSV dosyası. trail_missions içeren bir sefer ayar dosyası bunun yerini alır.
option_1_3_header: Dosya yolları
option_1_3_text: |-
  İlk sefer için tanımlanan dosyaları görüntüleyin ve temizleyin
option_1_4_header: CSV verileri
option_1_4_text: |-
  İlk seferin CSV dosyasını görev başına bir JSON dosyasına dışa aktarın veya bu JSON dosyalarını tekrar CSV dosyasına içe aktarın
