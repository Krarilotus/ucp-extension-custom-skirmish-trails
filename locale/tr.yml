menu_paths_notice: "Bir sefer ayar dosyası tanımlı: trail_missions içeriyorsa onun CSV dosyası kullanılır ve CSV yolları yalnızca yedektir."
menu_paths_status: "\"Kaydet ve Kapat\"a bastığınızda {count} yol temizlenecek."
menu_csv_intro: "Dışa aktarma, bu seferin CSV dosyasındaki her görev satırını export/<name>/ içine ayrı bir JSON dosyası olarak yazar. İçe aktarma, CSV dosyasının yanındaki klasördeki (trail.csv → trail/) JSON dosyalarını import/<name>.csv dosyasında birleştirir. export/ ve import/, oyunun kullanıcı klasöründeki ucp/userdata/custom-skirmish-trails içindedir; ucp3.log dosyaların adlarını verir."
menu_csv_steps: "İşi oyun yapar: bir düğme seçin, \"Kaydet ve Kapat\"a basın, ardından oyunu bir kez başlatın."
