option_1_header: First Edition Trail
option_1_text: Customize the first trail.
option_1_1_header: Trail settings file
option_1_1_text: The first trail's settings file (.json). Leave empty to keep the game's own.
option_1_2_header: Csv file (without trail settings file)
option_1_2_text: The first trail's csv file, for use without a trail settings file. A trail settings file with trail_missions
  takes its place.
option_1_3_header: File paths
option_1_3_text: See and clear the files set for the first trail
option_1_4_header: CSV data
option_1_4_text: Export the first trail's csv file to one JSON file per mission, or import those JSON files back
  into the csv file
