option_4_header: 'Строгий режим: подробная проверка CSV- и JSON-файлов путей'
option_4_text: |-
  Записывает в журнал каждую проблему в файлах пути. Может показывать окна ошибок при запуске игры. Без этой опции выводится по одному предупреждению на проблемный файл.
menu_paths_intro: "Файлы, заданные для этого пути. Очистите путь, чтобы не использовать этот файл, затем нажмите «Сохранить и Закрыть»."
menu_paths_settings: "Файл настроек пути"
menu_paths_csv: "CSV-файл"
menu_paths_none: "Для этого пути не задано ни одного файла."
menu_paths_cleared: "(очищено)"
menu_paths_clear: "Очистить"
menu_paths_clear_csv: "Очистить пути CSV"
menu_paths_notice: "Задан файл настроек пути: если в нём есть trail_missions, используется его CSV-файл, а пути CSV служат только запасным вариантом."
menu_paths_status: "Будет очищено путей: {count} (при нажатии «Сохранить и Закрыть»)."
menu_csv_intro: "Экспорт записывает каждую строку миссии из CSV-файла этого пути в отдельный JSON-файл в export/<name>/. Импорт собирает JSON-файлы из папки рядом с CSV-файлом (trail.csv → trail/) в import/<name>.csv. export/ и import/ находятся в ucp/userdata/custom-skirmish-trails в пользовательской папке игры; ucp3.log называет файлы."
menu_csv_steps: "Работу выполняет игра: выберите кнопку, нажмите «Сохранить и Закрыть», затем один раз запустите игру."
menu_csv_export: "Экспортировать данные CSV"
menu_csv_import: "Импортировать данные CSV"
menu_csv_requested: "Запрошено: {action}. Нажмите «Сохранить и Закрыть», затем один раз запустите игру, чтобы выполнить запрос."
menu_csv_saved: "Сохранённый запрос: {action} ({time}). Он выполнится один раз, при следующем запуске игры."
