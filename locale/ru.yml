trail_source_text: Выберите CSV-файл кампании или JSON-файл с её настройками.
option_1_header: Путь крестоносца (First Edition)
option_1_text: |-
  Настройте первый путь схваток.
option_2_header: Путь Warchest
option_2_text: |-
  Настройте путь Warchest.
option_3_header: Путь Extreme
option_3_text: |-
  Настройте путь Extreme.
option_4_header: 'Строгий режим: подробная проверка CSV- и JSON-файлов кампаний'
option_4_text: |-
  Записывает в журнал каждую проблему в файлах кампаний. Может показывать окна ошибок при запуске игры. Без этой опции выводится по одному предупреждению на проблемный файл.
