option_1_header: Путь крестоносца (First Edition)
option_1_text: |-
  Настройте первый путь схваток. Обычно здесь достаточно указать файл настроек пути: он сам задаёт данные миссий (trail_missions) и языковые файлы.
option_1_1_header: Файл настроек пути
option_1_1_text: |-
  Файл .json с настройками первого пути: данные миссий (CSV и JSON-файлы миссий), языковые файлы, название, описание, год начала, изображения кнопок, фон, координаты миссий и имена ИИ (см. trail-settings.schema.json). Оставьте пустым, чтобы сохранить стандартные значения игры.
option_1_2_header: CSV-файл (без файла настроек пути)
option_1_2_text: |-
  CSV-файл первого пути для использования без файла настроек пути. Файл настроек пути с параметром trail_missions заменяет его.
option_1_3_header: Пути к файлам
option_1_3_text: |-
  Просмотр и очистка файлов, заданных для первого пути
option_1_4_header: Данные CSV
option_1_4_text: |-
  Экспортировать CSV-файл первого пути в отдельные JSON-файлы по миссиям или импортировать эти JSON-файлы обратно в CSV-файл
