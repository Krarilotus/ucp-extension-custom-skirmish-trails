option_4_header: 'Строгий режим: подробная проверка CSV- и JSON-файлов путей'
option_4_text: |-
  Записывает в журнал каждую проблему в CSV-файлах, файлах миссий, языковых файлах и файлах настроек пути, каждую настройку, откатившуюся к значению игры по умолчанию, и каждый отсутствующий в языковом файле текст. Может показывать окна ошибок при запуске игры. Без этой опции выводится по одному предупреждению на проблемный файл.
