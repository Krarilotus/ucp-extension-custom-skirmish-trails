option_1_header: Путь крестоносца (First Edition)
option_1_text: |-
  Настройте первый путь схваток.
option_1_1_header: Файл настроек пути
option_1_1_text: |-
  Файл настроек первого пути (.json). Оставьте пустым, чтобы сохранить стандартные значения игры.
option_1_2_header: CSV-файл (без файла настроек пути)
option_1_2_text: |-
  CSV-файл первого пути для использования без файла настроек пути. Файл настроек пути с параметром trail_missions заменяет его.
option_1_3_header: Пути к файлам
option_1_3_text: |-
  Просмотр и очистка файлов, заданных для первого пути
option_1_4_header: Данные CSV
option_1_4_text: |-
  Экспортировать CSV-файл первого пути в отдельные JSON-файлы по миссиям или импортировать эти JSON-файлы обратно в CSV-файл
option_2_header: Путь Warchest
option_2_text: |-
  Настройте путь Warchest.
option_2_1_header: Файл настроек пути
option_2_1_text: |-
  Файл настроек пути Warchest (.json). Оставьте пустым, чтобы сохранить стандартные значения игры.
option_2_2_header: CSV-файл (без файла настроек пути)
option_2_2_text: |-
  CSV-файл пути Warchest для использования без файла настроек пути. Файл настроек пути с параметром trail_missions заменяет его.
option_2_3_header: Пути к файлам
option_2_3_text: |-
  Просмотр и очистка файлов, заданных для пути Warchest
option_2_4_header: Данные CSV
option_2_4_text: |-
  Экспортировать CSV-файл пути Warchest в отдельные JSON-файлы по миссиям или импортировать эти JSON-файлы обратно в CSV-файл
option_3_header: Путь Extreme
option_3_text: |-
  Настройте путь Extreme.
option_3_1_header: Файл настроек пути
option_3_1_text: |-
  Файл настроек пути Extreme (.json). Оставьте пустым, чтобы сохранить стандартные значения игры.
option_3_2_header: CSV-файл (без файла настроек пути)
option_3_2_text: |-
  CSV-файл пути Extreme для использования без файла настроек пути. Файл настроек пути с параметром trail_missions заменяет его.
option_3_3_header: Пути к файлам
option_3_3_text: |-
  Просмотр и очистка файлов, заданных для пути Extreme
option_3_4_header: Данные CSV
option_3_4_text: |-
  Экспортировать CSV-файл пути Extreme в отдельные JSON-файлы по миссиям или импортировать эти JSON-файлы обратно в CSV-файл
option_4_header: 'Строгий режим: подробная проверка CSV- и JSON-файлов путей'
option_4_text: |-
  Записывает в журнал каждую проблему в файлах пути. Может показывать окна ошибок при запуске игры. Без этой опции выводится по одному предупреждению на проблемный файл.
