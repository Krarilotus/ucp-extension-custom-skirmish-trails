option_4_header: 'Modo estricto: comprobar en detalle los archivos CSV y JSON de las sendas'
option_4_text: |-
  Registra cada problema en los archivos de la senda. Puede mostrar cuadros de error al iniciar el juego. Sin él, aparece una sola advertencia por archivo con problemas.
