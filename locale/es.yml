option_4_header: 'Modo estricto: comprobar en detalle los archivos CSV y JSON de las sendas'
option_4_text: |-
  Registra cada problema en los archivos CSV, de misión, de idioma y de ajustes de la senda, cada ajuste que recurre al valor propio del juego y cada texto que falta en un archivo de idioma. Puede mostrar cuadros de error al iniciar el juego. Sin él, aparece una sola advertencia por archivo con problemas.
