option_1_header: Senda de la Primera Edición
option_1_text: |-
  Personaliza la primera senda de escaramuzas. Normalmente basta con indicar aquí el archivo de ajustes de la senda: él mismo define los datos de misiones (trail_missions) y los archivos de idioma.
option_1_1_header: Archivo de ajustes de la senda
option_1_1_text: |-
  Un archivo .json con los ajustes de la primera senda: datos de misiones (archivos CSV y JSON de misión), archivos de idioma, título, resumen, año de inicio, imágenes de botones, fondo, posiciones de misiones y nombres de la IA (véase trail-settings.schema.json). Déjalo vacío para conservar los del juego.
option_1_2_header: Archivo CSV (sin archivo de ajustes de la senda)
option_1_2_text: |-
  El archivo CSV de la primera senda para usar sin archivo de ajustes de la senda. Un archivo de ajustes de la senda con trail_missions ocupa su lugar.
option_1_3_header: Rutas de archivos
option_1_3_text: |-
  Ver y borrar los archivos asignados a la primera senda
option_1_4_header: Datos CSV
option_1_4_text: |-
  Exportar el archivo CSV de la primera senda a un archivo JSON por misión, o importar esos archivos JSON de vuelta al archivo CSV
