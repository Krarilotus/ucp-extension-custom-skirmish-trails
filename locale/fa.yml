option_1_header: مسیر نبرد آزاد نسخهٔ اول (First Edition Trail)
option_1_text: |-
  مسیر اول نبرد آزاد را سفارشی کنید.
option_1_1_header: فایل تنظیمات مسیر
option_1_1_text: |-
  فایل تنظیمات مسیر اول (.json). برای حفظ مقادیر خود بازی خالی بگذارید.
option_1_2_header: فایل CSV (بدون فایل تنظیمات مسیر)
option_1_2_text: |-
  فایل CSV مسیر اول برای استفاده بدون فایل تنظیمات مسیر. اگر فایل تنظیمات مسیر دارای trail_missions باشد، جایگزین این مورد می‌شود.
option_1_3_header: مسیر فایل‌ها
option_1_3_text: |-
  مشاهده و پاک کردن فایل‌های تنظیم‌شده برای مسیر اول
option_1_4_header: داده‌های CSV
option_1_4_text: |-
  خروجی گرفتن از فایل CSV مسیر اول به یک فایل JSON برای هر مأموریت، یا وارد کردن دوبارهٔ آن فایل‌های JSON به فایل CSV
