option_4_header: 'حالت سخت‌گیرانه: بررسی دقیق فایل‌های CSV و JSON مسیرها'
option_4_text: |-
  هر خطا در فایل‌های مسیر را در گزارش ثبت می‌کند. ممکن است هنگام شروع بازی پنجره‌های خطا نمایش دهد. بدون آن، برای هر فایلِ دارای مشکل تنها یک هشدار ثبت می‌شود.
