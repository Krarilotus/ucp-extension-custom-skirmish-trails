option_4_header: 'حالت سخت‌گیرانه: بررسی دقیق فایل‌های CSV و JSON مسیرها'
option_4_text: |-
  هر خطا در فایل‌های مسیر را در گزارش ثبت می‌کند. ممکن است هنگام شروع بازی پنجره‌های خطا نمایش دهد. بدون آن، برای هر فایلِ دارای مشکل تنها یک هشدار ثبت می‌شود.
menu_paths_intro: "فایل‌های تنظیم‌شده برای این مسیر. برای کنار گذاشتن یک فایل، مسیر آن را پاک کنید و سپس «ذخیره و بستن» را بزنید."
menu_paths_settings: "فایل تنظیمات مسیر"
menu_paths_csv: "فایل CSV"
menu_paths_none: "هیچ فایلی برای این مسیر تنظیم نشده است."
menu_paths_cleared: "(پاک شد)"
menu_paths_clear: "پاک کردن"
menu_paths_clear_csv: "پاک کردن مسیرهای CSV"
menu_paths_notice: "یک فایل تنظیمات مسیر تنظیم شده است: اگر trail_missions داشته باشد، فایل CSV آن استفاده می‌شود و مسیرهای CSV فقط جایگزین هستند."
menu_paths_status: "با زدن «ذخیره و بستن»، {count} مسیر پاک می‌شود."
menu_csv_intro: "خروجی گرفتن هر سطر مأموریت از فایل CSV این مسیر را در یک فایل JSON جداگانه می‌نویسد. وارد کردن، فایل‌های JSON پوشه‌ای را که هم‌نام فایل CSV است دوباره در یک فایل CSV کنار هم می‌گذارد. هر دو در ucp/userdata/custom-skirmish-trails در پوشهٔ کاربری بازی می‌نویسند؛ ucp3.log نام فایل‌ها را می‌آورد."
menu_csv_steps: "کار را خود بازی انجام می‌دهد: یک دکمه را انتخاب کنید، «ذخیره و بستن» را بزنید و سپس بازی را یک بار اجرا کنید."
menu_csv_export: "خروجی گرفتن از داده‌های CSV"
menu_csv_import: "وارد کردن داده‌های CSV"
menu_csv_requested: "{action} درخواست شد. «ذخیره و بستن» را بزنید و سپس برای اجرای آن بازی را یک بار اجرا کنید."
menu_csv_saved: "درخواست ذخیره‌شده: {action} ({time}). یک بار، در اجرای بعدی بازی انجام می‌شود."
