option_1_header: Első hadjárat (First Edition)
option_1_text: |-
  Az első csetepaté-hadjárat testreszabása. Általában elég itt megadni a hadjárat beállításfájlját: az maga nevezi meg a küldetésadatokat (trail_missions) és a nyelvi fájlokat.
option_1_1_header: Hadjárat beállításfájl
option_1_1_text: |-
  Egy .json fájl az első hadjárat beállításaival: küldetésadatok (CSV és küldetés-JSON fájlok), nyelvi fájlok, cím, összefoglaló, kezdő év, gombképek, háttér, küldetéspozíciók és MI-nevek (lásd trail-settings.schema.json). Hagyd üresen a játék alapértelmezett értékeinek megtartásához.
option_1_2_header: CSV-fájl (hadjárat beállításfájl nélkül)
option_1_2_text: |-
  Az első hadjárat CSV-fájlja, ha nincs hadjárat beállításfájl. A trail_missions bejegyzést tartalmazó beállításfájl ennek a helyébe lép.
option_1_3_header: Fájlútvonalak
option_1_3_text: |-
  Az első hadjárathoz beállított fájlok megtekintése és törlése
option_1_4_header: CSV-adatok
option_1_4_text: |-
  Az első hadjárat CSV-fájljának exportálása küldetésenként egy JSON-fájlba, vagy ezen JSON-fájlok visszaimportálása a CSV-fájlba
