option_4_header: 'Szigorú mód: a hadjárat CSV- és JSON-fájljainak részletes ellenőrzése'
option_4_text: |-
  Naplóz minden hibát a CSV-, küldetés-, nyelvi és hadjárat-beállításfájlokban, minden olyan beállítást, amely a játék alapértelmezésére esik vissza, és minden szöveget, amely hiányzik egy nyelvi fájlból. A játék indításakor hibaablakokat jeleníthet meg. Enélkül fájlonként csak egy figyelmeztetés jelenik meg.
