menu_csv_intro: "导出会把此征程 CSV 文件中的每一行任务写入各自的 JSON 文件。导入会把与 CSV 文件同名文件夹中的 JSON 文件重新合并为一个 CSV 文件。两者都写入游戏用户文件夹中的 ucp/userdata/custom-skirmish-trails；ucp3.log 会列出这些文件。"
menu_csv_steps: "由游戏完成这项工作：选择一个按钮，按“保存并关闭”，然后启动一次游戏。"
