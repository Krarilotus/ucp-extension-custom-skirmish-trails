option_1_header: 初版遭遇战征程（First Edition Trail）
option_1_text: |-
  自定义第一个遭遇战征程。通常只需在此设置征程设置文件：它本身会指定任务数据（trail_missions）和语言文件。
option_1_1_header: 征程设置文件
option_1_1_text: |-
  包含第一个征程各项设置的 .json 文件：任务数据（CSV 和任务 JSON 文件）、语言文件、标题、简介、起始年份、按钮图片、背景、任务坐标和 AI 名称（参见 trail-settings.schema.json）。留空以保留游戏默认设置。
option_1_2_header: CSV 文件（不使用征程设置文件）
option_1_2_text: |-
  第一个征程的 CSV 文件，供未使用征程设置文件时使用。若设置了含 trail_missions 的征程设置文件，则会取代此项。
option_1_3_header: 文件路径
option_1_3_text: |-
  查看并清除为第一个征程设置的文件
option_1_4_header: CSV 数据
option_1_4_text: |-
  将第一个征程的 CSV 文件导出为每个任务一个 JSON 文件，或将这些 JSON 文件导回 CSV 文件
