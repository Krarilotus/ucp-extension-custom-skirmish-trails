option_1_header: Kreuzzugsmarsch (First Edition)
option_1_text: |-
  Passe den ersten Kreuzzugsmarsch an.
option_1_1_header: Marsch-Einstellungsdatei
option_1_1_text: |-
  Die Marsch-Einstellungsdatei des ersten Marschs (.json). Leer lassen, um die spielinternen Werte zu behalten.
option_1_2_header: CSV-Datei (ohne Marsch-Einstellungsdatei)
option_1_2_text: |-
  Die CSV-Datei des ersten Marschs für die Nutzung ohne Marsch-Einstellungsdatei. Eine Marsch-Einstellungsdatei mit trail_missions tritt an ihre Stelle.
option_1_3_header: Dateipfade
option_1_3_text: |-
  Zeige und leere die für den ersten Marsch festgelegten Dateien
option_1_4_header: CSV-Daten
option_1_4_text: |-
  Exportiere die CSV-Datei des ersten Marschs in je eine JSON-Datei pro Mission oder importiere diese JSON-Dateien zurück in die CSV-Datei
