option_4_header: 'Mode strict : vérifier en détail les fichiers CSV et JSON des pistes'
option_4_text: |-
  Consigne chaque problème dans les fichiers CSV, de mission, de langue et de paramètres de piste, chaque paramètre qui revient à la valeur par défaut du jeu, et chaque texte absent d'un fichier de langue. Peut afficher des boîtes d'erreur au démarrage du jeu. Sans cette option, un seul avertissement est affiché par fichier défectueux.
