menu_paths_notice: "Un fichier de paramètres de piste est défini : s'il contient trail_missions, son fichier CSV est utilisé et les chemins CSV ne servent que de repli."
menu_paths_status: "{count} chemin(s) seront effacés lorsque vous appuierez sur « Sauvegarder et Fermer »."
menu_csv_intro: "Exporter écrit chaque ligne de mission du fichier CSV de cette piste dans un fichier JSON sous export/<name>/. Importer rassemble les fichiers JSON du dossier voisin du fichier CSV (trail.csv → trail/) dans import/<name>.csv. export/ et import/ sont dans ucp/userdata/custom-skirmish-trails, dans le dossier utilisateur du jeu ; ucp3.log indique les fichiers."
menu_csv_steps: "Le jeu fait le travail : choisissez un bouton, appuyez sur « Sauvegarder et Fermer », puis lancez le jeu une fois."
