option_1_header: Piste Première Édition
option_1_text: |-
  Personnalise la première piste d'escarmouche. En règle générale, le fichier de paramètres de piste suffit ici : il indique lui-même les données de missions (trail_missions) et les fichiers de langue.
option_1_1_header: Fichier de paramètres de piste
option_1_1_text: |-
  Un fichier .json contenant les paramètres de la première piste : données de missions (fichiers CSV et JSON de mission), fichiers de langue, titre, résumé, année de départ, images de boutons, arrière-plan, positions des missions et noms d'IA (voir trail-settings.schema.json). Laissez vide pour conserver les valeurs du jeu.
option_1_2_header: Fichier CSV (sans fichier de paramètres de piste)
option_1_2_text: |-
  Le fichier CSV de la première piste, pour une utilisation sans fichier de paramètres de piste. Un fichier de paramètres de piste avec trail_missions le remplace.
option_1_3_header: Chemins de fichiers
option_1_3_text: |-
  Afficher et effacer les fichiers définis pour la première piste
option_1_4_header: Données CSV
option_1_4_text: |-
  Exporter le fichier CSV de la première piste en un fichier JSON par mission, ou réimporter ces fichiers JSON dans le fichier CSV
