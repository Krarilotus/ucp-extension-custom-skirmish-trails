option_1_header: Piste Première Édition
option_1_text: |-
  Personnalise la première piste d'escarmouche.
option_1_1_header: Fichier de paramètres de piste
option_1_1_text: |-
  Le fichier de paramètres de la première piste (.json). Laissez vide pour conserver les valeurs du jeu.
option_1_2_header: Fichier CSV (sans fichier de paramètres de piste)
option_1_2_text: |-
  Le fichier CSV de la première piste, pour une utilisation sans fichier de paramètres de piste. Un fichier de paramètres de piste avec trail_missions le remplace.
option_1_3_header: Chemins de fichiers
option_1_3_text: |-
  Afficher et effacer les fichiers définis pour la première piste
option_1_4_header: Données CSV
option_1_4_text: |-
  Exporter le fichier CSV de la première piste en un fichier JSON par mission, ou réimporter ces fichiers JSON dans le fichier CSV
