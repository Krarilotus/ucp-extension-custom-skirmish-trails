option_4_header: 'Mode strict : vérifier en détail les fichiers CSV et JSON des pistes'
option_4_text: |-
  Consigne chaque problème dans les fichiers de piste. Peut afficher des boîtes d'erreur au démarrage du jeu. Sans cette option, un seul avertissement est affiché par fichier défectueux.
menu_paths_intro: "Les fichiers définis pour cette piste. Effacez un chemin pour ne pas utiliser ce fichier, puis appuyez sur « Sauvegarder et Fermer »."
menu_paths_settings: "Fichier de paramètres de piste"
