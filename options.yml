options:
- category:
  - '{{misc}}'
  name: firstedition
  display: GroupBox
  header: '{{option_1_header}}'
  text: '{{option_1_text}}'
  hasHeader: true
  children:
  - name: settings_details
    display: GroupBox
    hasHeader: true
    header: '{{option_1_1_header}}'
    text: '{{option_1_1_text}}'
    children:
    - name: settings
      header: '{{option_1_1_header}}'
      display: FileInput
      url: custom-skirmish-trails.firstedition.settings.path
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
  - name: csv_details
    display: GroupBox
    hasHeader: true
    header: '{{option_1_2_header}}'
    text: '{{option_1_2_text}}'
    children:
    - name: csv
      header: '{{option_1_2_header}}'
      display: FileInput
      url: custom-skirmish-trails.firstedition.csv.path
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
  - name: filepaths
    header: '{{option_1_3_header}}'
    text: '{{option_1_3_text}}'
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition
    contents:
      type: custom
      source:
        html: file-paths.html
        css: file-paths.css
        js: file-paths.js
  - name: conversion
    header: '{{option_1_4_header}}'
    text: '{{option_1_4_text}}'
    hasHeader: true
    display: CustomMenu
    url: custom-skirmish-trails.firstedition.conversion
    contents:
      type: custom
      source:
        html: csv-data.html
        css: csv-data.css
        js: csv-data.js
